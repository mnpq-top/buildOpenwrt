name: Build lede openwrt

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'ssh debug'
        required: false
        default: false
      repo_url:
        required: true
        description: '源代码仓库URL'
        default: 'https://github.com/coolsnowwolf/lede'
      repo_branch:
        required: true
        description: '源代码仓库分支'
        default: 'master'
      cpu_brand:
        required: true
        description: 'cpu品牌 CONFIG_TARGET_airoha=y'
        default: 'airoha'
      cpu_model:
        required: true
        description: 'cpu型号CONFIG_TARGET_airoha_an7581=y'
        default: 'airoha_an7581'
      device_model:
        required: true
        description: '设备型号CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5382a'
        default: 'fiberhome_hg5382a'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Apt-get
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get update -y -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git tar \
            libncurses5-dev libssl-dev python3-setuptools \
            rsync swig zip unzip zlib1g-dev file wget curl ccache tree dwarves
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Git
        run: |
          git clone ${{ github.event.inputs.repo_url }} -b ${{ github.event.inputs.repo_branch }} openwrt
          cat <<EOF >openwrt/release.body
          ${{ github.event.inputs.repo_url }}
          ${{ github.event.inputs.repo_branch }}
          EOF

      - name: Feeds
        run: |
          cat <<EOF >openwrt/.config
          CONFIG_TARGET_${{ github.event.inputs.cpu_brand }}=y
          CONFIG_TARGET_${{ github.event.inputs.cpu_model }}=y
          CONFIG_TARGET_${{ github.event.inputs.cpu_model }}_DEVICE_${{ github.event.inputs.device_model }}=y
          EOF
          chmod +x ledewrt.sh
          cd openwrt
          ../ledewrt.sh

      - name: Setup upterm session
        if: ${{ github.event.inputs.debug_enabled }}
        uses: owenthereal/action-upterm@v2
        with:
          wait-timeout-minutes: 5
          limit-access-to-actor: true # Restrict to the user who triggered the workflow
      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.debug_enabled }}
        with:
          name: artifact
          path: $GITHUB_WORKSPACE/debug
      - if: ${{ github.event.inputs.debug_enabled }}
        run: exit 1
      - name: Config
        run: |
          cd openwrt
          make defconfig
          cat .config

      - uses: klever1988/cachewrtbuild@main
        with:
          ccache: true
          mixkey: ${{ github.event.inputs.cpu_model }}
          prefix: 'lede'

      - name: Download
        run: |
          cd openwrt
          make download -j16 || make download -j1 V=s

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          
      - name: tar
        run: |
          tree openwrt/bin/ #>> openwrt/release.body
          cd openwrt/bin/targets/*/*
          cp /workdir/openwrt/.config cp.config
          echo "FIRMWAREDIR=$PWD" >> $GITHUB_ENV
          tar -zcvf - ../../../packages/ | split -d -b 500m - openwrt.bin.packages.tar.gz. || true
          tar -zcvf - packages/ | split -d -b 500m - packages.tar.gz. || true
          rm -rf packages

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ steps.date.outputs.date }}-${{ github.run_number }}"
          tag_name: "build-${{ steps.date.outputs.date }}-${{ github.run_number }}"
          body_path: "openwrt/release.body"
          files: ${{ env.FIRMWAREDIR }}/*
