name: Build lede

on:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: 'ssh debug'
        required: false
        default: false
      repo_url:
        required: true
        description: '源代码仓库URL'
        default: 'https://github.com/chasey-dev/immortalwrt-mt798x-rebase'
      repo_branch:
        required: true
        description: '源代码仓库分支'
        default: '25.12'
      cpu_model:
        required: true
        description: 'cpu品类_型号'
        default: 'mediatek_filogic'
      device_model:
        required: true
        description: '设备型号(填all则全型号(容易失败))'
        default: 'cmcc_rax3000m'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apt-get
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get update -y -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git tar \
            libncurses5-dev libssl-dev python3-setuptools \
            rsync swig zip unzip zlib1g-dev file wget curl ccache tree dwarves
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Git
        run: |
          git clone ${{ inputs.repo_url }} -b ${{ inputs.repo_branch }} openwrt
          ownerrepo=${{ inputs.repo_url }}
          echo "ownerrepo=${ownerrepo#*//}" >> $GITHUB_ENV
          cat <<EOF >openwrt/release.body
          ${ownerrepo} ${{ inputs.repo_branch }}
          EOF
          cd openwrt && git log -n 1 --oneline >> release.body
      - name: Add feeds & packages
        run: cd openwrt && source ../mt798x.sh && addfeeds
      - name: Feeds update & install
        run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a
      - name: Make .config
        run: |
          cd openwrt && source ../mt798x.sh
          cpu_brand=${{ inputs.cpu_model }}
          cpu_brand=${cpu_brand%_*}
          echo CONFIG_TARGET_${cpu_brand}=y >.config
          echo CONFIG_TARGET_${{ inputs.cpu_model }}=y >>.config
          if [ "${{ inputs.device_model }}" == "all" ]
          then
            echo CONFIG_TARGET_MULTI_PROFILE=y >>.config
            echo CONFIG_TARGET_ALL_PROFILES=y >>.config
            echo CONFIG_TARGET_PER_DEVICE_ROOTFS=y >>.config
          else
            echo CONFIG_TARGET_${{ inputs.cpu_model }}_DEVICE_${{ inputs.device_model }}=y >>.config
          fi
          cat .config
          make defconfig
          cat .config
      - name: add & del packages
        run: |
          cd openwrt && source ../mt798x.sh
          delpkg
          make defconfig
          addpkg
          make defconfig
          cat .config
      - run: grep -v '^#' openwrt/.config

       # Restrict to the user who triggered the workflow
      
      - if: inputs.debug
        run: exit 1

      - uses: klever1988/cachewrtbuild@main
        with:
          ccache: true
          mixkey: ${{ env.ownerrepo }}-${{ inputs.cpu_model }}
          prefix: openwrt

      - name: Download
        run: |
          cd openwrt
          make download -j16 || make download -j1 V=s

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: tar
        run: |
          cd openwrt/bin && tree -L 5
          cd targets/*/*
          ln -s $PWD ${{ github.workspace }}/openwrt/Release
          tar -zcvf - ../../../packages/ | split -d -b 500m - openwrt.bin.packages.tar.gz. || true
          tar -zcvf - packages/ | split -d -b 500m - packages.tar.gz. || true
          rm -rf packages
          cp ${{ github.workspace }}/openwrt/.config ${{ github.workspace }}/openwrt/Release/use.config

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ inputs.cpu_model }}-${{ inputs.device_model }}-${{ github.run_number }}"
          tag_name: "${{ inputs.cpu_model }}-${{ inputs.device_model }}-${{ github.run_number }}"
          body_path: "openwrt/release.body"
          files: ${{ github.workspace }}/openwrt/Release/*
      - name: Setup upterm session
        if: failure() || inputs.debug
        uses: owenthereal/action-upterm@v2
        with:
          wait-timeout-minutes: 5
          limit-access-to-actor: tru
      - uses: actions/upload-artifact@v4
        if: failure() || inputs.debug
        with:
          name: artifact
          path: ${{ github.workspace }}/debug
